name: Database Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY to confirm the database migration
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Apply database schema
    if: inputs.confirmation == 'APPLY'
    runs-on: ubuntu-latest
    environment: database-migration
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: npm run db:migrate